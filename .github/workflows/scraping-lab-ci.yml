name: Scraping Lab CI

on:
  push:
    paths:
      - "scraping-lab/**"
      - ".github/workflows/scraping-lab-ci.yml"
  pull_request:
    paths:
      - "scraping-lab/**"
      - ".github/workflows/scraping-lab-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraping-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q
